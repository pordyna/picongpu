##
## This configuration file is used by PIConGPU's TBG tool to create a
## batch script for PIConGPU runs. For a detailed description of PIConGPU
## configuration files including all available variables, see
##
##                      docs/TBG_macros.cfg
##


#################################
## Section: Required Variables ##
#################################

TBG_wallTime="24:00:00"

TBG_devices_x=4
TBG_devices_y=8
TBG_devices_z=2

TBG_gridSize="1344 1344 1344"
TBG_steps="9000"

TBG_gridDist="--gridDist '336{4}' '420,84{6},420' '672{2}'"

TBG_periodic="--periodic 1 0 1"


#################################
## Section: Optional Variables ##
#################################


# useful for heating tests
TBG_sumEnergy="--fields_energy.period 200 \
               --e_energy.period 100 --e_energy.filter all \
               --Al_energy.period 100 --Al_energy.filter all"

TBG_chargeConservation="--chargeConservation.period 200"

TBG_e_histogram="--e_energyHistogram.period 200 --e_energyHistogram.filter all  --e_energyHistogram.binCount 1024 \
                 --e_energyHistogram.minEnergy 0 --e_energyHistogram.maxEnergy 20000"

# longitudinal phase space: in m_<species> c
TBG_e_PSypy="--e_phaseSpace.period 250 --e_phaseSpace.filter all --e_phaseSpace.space y \
             --e_phaseSpace.momentum py --e_phaseSpace.min -30.0 --e_phaseSpace.max 30.0"
TBG_e_PSxpy="--e_phaseSpace.period 250 --e_phaseSpace.filter all --e_phaseSpace.space x \
            --e_phaseSpace.momentum py --e_phaseSpace.min -30.0 --e_phaseSpace.max 30.0"
TBG_e_PSzpy="--e_phaseSpace.period 250 --e_phaseSpace.filter all --e_phaseSpace.space z \
            --e_phaseSpace.momentum py --e_phaseSpace.min -30.0 --e_phaseSpace.max 30.0"



# output 1
TBG_ADIOS2_configuration_compression="'{              \
  \"adios2\": {                                       \
      \"dataset\": {                                  \
          \"operators\": [ {                          \
              \"type\": \"blosc\"                     \
              , \"parameters\": {                     \
               \"clevel\": \"9\"                      \
               ,\"cname\": \"zstd\"                   \
               , \"doshuffle\": \"BLOSC_BITSHUFFLE\"  \
               } \
          } ]                                         \
      }                                               \
      , \"engine\": {                                 \
          \"type\": \"file\"                          \
          , \"parameters\": {                         \
              \"BufferGrowthFactor\": \"1.1\"         \
              , \"InitialBufferSize\": \"36GB\"       \
              , \"AggregatorRatio\" : \"1\"           \
          }                                           \
      }                                               \
  }                                                   \
}'"

TBG_openPMD="--openPMD.period 1000  \
             --openPMD.file simData \
             --openPMD.ext bp \
             --openPMD.json !TBG_ADIOS2_configuration_compression"

#TBG_checkpoint="--checkpoint.restart --checkpoint.restart.directory /bigdata/hplsim/production/ordyna35/2021_Spring_FaradayRotationSims/beforeOutput/simOutput/checkpoints  --checkpoint.restart.backend openPMD --checkpoint.openPMD.json !TBG_ADIOS2_configuration_compression"
TBG_checkpoint="--checkpoint.period 10000:10000 \
                --checkpoint.backend openPMD \
                --checkpoint.openPMD.json !TBG_ADIOS2_configuration_compression"

TBG_photonDetector_Wave=" \
                    --ph_AddWaveParticlesCfg_photonDetector.period 2300:9000:1000,9000 \
                    --ph_AddWaveParticlesCfg_photonDetector.placement z+ \
                    --ph_AddWaveParticlesCfg_photonDetector.ext bp \
                    --ph_AddWaveParticlesCfg_photonDetector.size.x 1024 \
                    --ph_AddWaveParticlesCfg_photonDetector.size.y 1024 \
                    --ph_AddWaveParticlesCfg_photonDetector.dir detectorWaves"

TBG_photonDetector_Count=" \
                    --ph_CountParticlesCfg_photonDetector.period 2300:9000:100\
                    --ph_CountParticlesCfg_photonDetector.placement z+         \
                    --ph_CountParticlesCfg_photonDetector.ext bp               \
                    --ph_CountParticlesCfg_photonDetector.size.x 1024           \
                    --ph_CountParticlesCfg_photonDetector.size.y 1024 \
                    --ph_CountParticlesCfg_photonDetector.dir detectorCounter"

TBG_resources="
--resourceLog.period 100 \
--resourceLog.stream file \
--resourceLog.properties rank position currentStep particleCount cellCount \
--resourceLog.format jsonpp"

TBG_macroParticlesCount="--ph_macroParticlesCount.period 100 \
                         --e_macroParticlesCount.period 100 \
                         --Al_macroParticlesCount.period 100"

TBG_macroParticlesPerSuperCell="--e_macroParticlesPerSuperCell.period 1000 \
                                --ph_macroParticlesPerSuperCell.period 1000 \
                                --Al_macroParticlesPerSuperCell.period 1000"


TBG_debugExternalBeam="--debugExternalBeam.period 100"


TBG_plugins=" \
             !TBG_openPMD \
             !TBG_e_histogram \
             !TBG_chargeConservation \
             !TBG_sumEnergy \
             !TBG_resources \
             !TBG_e_PSypy \
             !TBG_e_PSxpy \
             !TBG_e_PSzpy \
             !TBG_checkpoint \
             !TBG_macroParticlesCount \
             !TBG_photonDetector_Wave \
             !TBG_photonDetector_Count \
             !TBG_macroParticlesCount \
             !TBG_macroParticlesPerSuperCell \
             !TBG_debugExternalBeam \
             "



#################################
## Section: Program Parameters ##
#################################

TBG_deviceDist="!TBG_devices_x !TBG_devices_y !TBG_devices_z"

TBG_programParams="-d !TBG_deviceDist \
                   -g !TBG_gridSize   \
                   -s !TBG_steps      \
                   !TBG_gridDist      \
                   !TBG_periodic      \
                   !TBG_plugins       \
                   --versionOnce"

# TOTAL number of devices
TBG_tasks="$(( TBG_devices_x * TBG_devices_y * TBG_devices_z ))"

"$TBG_cfgPath"/submitAction.sh
