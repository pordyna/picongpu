##
## This configuration file is used by PIConGPU's TBG tool to create a
## batch script for PIConGPU runs. For a detailed description of PIConGPU
## configuration files including all available variables, see
##
##                      docs/TBG_macros.cfg
##


#################################
## Section: Required Variables ##
#################################


TBG_wallTime="10:00:00"

TBG_devices_x=1
TBG_devices_y=1
TBG_devices_z=1

TBG_gridSize="64 128 64"
TBG_steps="60000"

# leave TBG_movingWindow empty to disable moving window
TBG_movingWindow=""



#################################
## Section: Optional Variables ##
#################################

# file I/O with openPMD-ADIOS
TBG_openPMD="--openPMD.period 0:0        \
             --openPMD.file simData      \
             --openPMD.ext bp"

TBG_photonDetector_Wave=" \
                    --ph_AddWaveParticlesCfg_photonDetector.period 0:10000:1000,10000   \
                    --ph_AddWaveParticlesCfg_photonDetector.placement z+         \
                    --ph_AddWaveParticlesCfg_photonDetector.ext bp               \
                    --ph_AddWaveParticlesCfg_photonDetector.size.x 1024           \
                    --ph_AddWaveParticlesCfg_photonDetector.size.y 1024 \
                    --ph_AddWaveParticlesCfg_photonDetector.dir detectorWaves"

TBG_photonDetector_Count=" \
                    --ph_CountParticlesCfg_photonDetector.period 0:10000:1000,10000   \
                    --ph_CountParticlesCfg_photonDetector.placement z+         \
                    --ph_CountParticlesCfg_photonDetector.ext bp               \
                    --ph_CountParticlesCfg_photonDetector.size.x 1024           \
                    --ph_CountParticlesCfg_photonDetector.size.y 1024 \
                    --ph_CountParticlesCfg_photonDetector.dir detectorCounter"
TBG_photonDetector_MacroCount=" \
                    --ph_CountMacroParticlesCfg_photonDetector.period 0:10000:1000,10000   \
                    --ph_CountMacroParticlesCfg_photonDetector.placement z+         \
                    --ph_CountMacroParticlesCfg_photonDetector.ext bp               \
                    --ph_CountMacroParticlesCfg_photonDetector.size.x 1024           \
                    --ph_CountMacroParticlesCfg_photonDetector.size.y 1024 \
                    --ph_CountMacroParticlesCfg_photonDetector.dir detectorMacroCounter"

TBG_plugins="!TBG_openPMD !TBG_photonDetector_Count !TBG_photonDetector_MacroCount \
             !TBG_photonDetector_Wave --ph_macroParticlesCount.period 0:1000:1,10000"


#################################
## Section: Program Parameters ##
#################################

TBG_deviceDist="!TBG_devices_x !TBG_devices_y !TBG_devices_z"

TBG_programParams="-d !TBG_deviceDist \
                   -g !TBG_gridSize   \
                   -s !TBG_steps      \
                   !TBG_movingWindow  \
                   !TBG_plugins       \
                   --versionOnce"

# TOTAL number of devices
TBG_tasks="$(( TBG_devices_x * TBG_devices_y * TBG_devices_z ))"

"$TBG_cfgPath"/submitAction.sh
