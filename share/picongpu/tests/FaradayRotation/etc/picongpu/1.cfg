##
## This configuration file is used by PIConGPU's TBG tool to create a
## batch script for PIConGPU runs. For a detailed description of PIConGPU
## configuration files including all available variables, see
##
##                      docs/TBG_macros.cfg
##


#################################
## Section: Required Variables ##
#################################


TBG_wallTime="24:00:00"

TBG_devices_x=2
TBG_devices_y=1
TBG_devices_z=2

TBG_gridSize="64 128 512"
TBG_steps="11000"

# leave TBG_movingWindow empty to disable moving window
TBG_movingWindow=""



#################################
## Section: Optional Variables ##
#################################

# file I/O with openPMD-HDF5
TBG_openPMD="--openPMD.period 200          \
             --openPMD.file simData        \
             --openPMD.ext bp"

TBG_photonDetector="--ph_AmplitudeWithPolarization_photonDetector.period 200           \
                    --ph_AmplitudeWithPolarization_photonDetector.placement z+         \
                    --ph_AmplitudeWithPolarization_photonDetector.ext json             \
                    --ph_AmplitudeWithPolarization_photonDetector.size.x 128           \
                    --ph_AmplitudeWithPolarization_photonDetector.size.y 64            \
                    --ph_AmplitudeWithPolarization_photonDetector.dir detectorPolarization"

TBG_photonDetector2="--ph_CountParticlesCfg_photonDetector.period 200           \
                     --ph_CountParticlesCfg_photonDetector.placement z+         \
                     --ph_CountParticlesCfg_photonDetector.ext json             \
                     --ph_CountParticlesCfg_photonDetector.size.x 128           \
                     --ph_CountParticlesCfg_photonDetector.size.y 64            \
                     --ph_CountParticlesCfg_photonDetector.dir detectorCount"

TBG_plugins="!TBG_openPMD !TBG_photonDetector !TBG_photonDetector2 --ph_macroParticlesCount.period 10"


#################################
## Section: Program Parameters ##
#################################

TBG_deviceDist="!TBG_devices_x !TBG_devices_y !TBG_devices_z"

TBG_programParams="-d !TBG_deviceDist \
                   -g !TBG_gridSize   \
                   -s !TBG_steps      \
                   !TBG_movingWindow  \
                   !TBG_plugins       \
                   --versionOnce"

# TOTAL number of devices
TBG_tasks="$(( TBG_devices_x * TBG_devices_y * TBG_devices_z ))"

"$TBG_cfgPath"/submitAction.sh
